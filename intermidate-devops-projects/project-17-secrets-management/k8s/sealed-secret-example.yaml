# This is what a SEALED secret looks like committed to Git - it's safe to
# commit because only the controller's private key (inside the cluster)
# can decrypt it. You generate this file with:
#
#   kubectl create secret generic devops-app-secret \
#     --from-literal=api_key=example-super-secret-key --dry-run=client -o yaml \
#     | kubeseal --format yaml > sealed-secret-example.yaml
#
# Applying it creates a normal Kubernetes Secret in the cluster; the
# encrypted blob below is meaningless to anyone without the controller's key.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: devops-app-secret
  namespace: devops-starter
spec:
  encryptedData:
    api_key: AgBy8h...REPLACE_WITH_REAL_OUTPUT_FROM_KUBESEAL...
  template:
    metadata:
      name: devops-app-secret
      namespace: devops-starter
