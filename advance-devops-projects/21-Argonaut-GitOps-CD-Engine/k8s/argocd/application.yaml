apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argonaut-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/you/argonaut
    path: k8s/overlays/prod
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
