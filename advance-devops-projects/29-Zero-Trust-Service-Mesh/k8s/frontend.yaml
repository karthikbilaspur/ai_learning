apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 2
  selector: {matchLabels: {app: frontend}}
  template:
    metadata:
      labels: {app: frontend}
      annotations: {sidecar.istio.io/inject: "true"}
    spec:
      serviceAccountName: frontend
      containers:
      - name: web
        image: ghcr.io/you/frontend:latest
