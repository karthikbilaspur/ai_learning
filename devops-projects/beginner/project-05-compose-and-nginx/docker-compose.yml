services:
  app:
    build: .
    container_name: devops-app
    restart: unless-stopped
    environment:
      APP_ENV: development
    expose:
      - "8000"

  nginx:
    image: nginx:1.27-alpine
    container_name: devops-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - app
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
