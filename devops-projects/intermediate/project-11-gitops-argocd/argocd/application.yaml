apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-starter
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/your-username/intermediate-devops-starter.git
    targetRevision: main
    path: project-11-gitops-argocd/k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: devops-starter

  syncPolicy:
    automated:
      prune: true      # delete resources that are removed from Git
      selfHeal: true    # revert manual kubectl edits back to Git's version
    syncOptions:
      - CreateNamespace=true
