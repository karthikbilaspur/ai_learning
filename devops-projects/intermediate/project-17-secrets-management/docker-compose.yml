services:
  vault:
    image: hashicorp/vault:1.18
    container_name: devops-vault
    restart: unless-stopped
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    environment:
      # Dev mode ONLY - auto-unseals and prints a root token to logs.
      # Never use dev mode outside learning/local testing.
      VAULT_DEV_ROOT_TOKEN_ID: devroot
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    command: server -dev

  app:
    build: .
    container_name: devops-app
    restart: unless-stopped
    environment:
      APP_ENV: development
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: devroot
    expose:
      - "8000"
    depends_on:
      - vault
